name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  lint:
    name: Lint + typy (ruff, mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy wms optimizer simulator mcp_wms orchestrator evals

  backend:
    name: Testy backendu (WMS, symulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -m "not security and not solver" -q

  security:
    name: Testy granicy uprawnień MCP (offline, bez LLM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -m security -v
      - name: Ewaluacja prompt injection — tryb offline (złośliwy agent skryptowy)
        run: python -m evals.agent_injection --offline --report-dir evals/reports/ci
      - uses: actions/upload-artifact@v4
        with:
          name: raport-injection-offline
          path: evals/reports/ci/

  solver:
    name: Testy solvera i benchmark tras
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -m solver -q
      - run: python -m optimizer.benchmark --seed 42 --orders 20 --instances 10 --out benchmark-ci.md
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark
          path: benchmark-ci.md

  frontend:
    name: Frontend (typy, testy, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  compose:
    name: Docker compose — smoke test (PostgreSQL, WMS, mcp-wms HTTP, orkiestrator)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Sekrety tylko dla CI
        run: |
          python scripts/gen_secrets.py --init
      - run: docker compose up -d --build db optimizer wms-api mcp-wms
      - name: Czekam na WMS
        run: |
          for i in $(seq 1 90); do curl -fs localhost:8000/health && break; sleep 2; done
          curl -fs localhost:8000/health
      - run: pip install -e .
      - name: Logowanie demo + KPI przez REST
        run: |
          BODY=$(python -c "import json;from simulator.seed_users import demo_users;u=next(x for x in demo_users() if x.username=='operator');print(json.dumps({'username':u.username,'password':u.password}))")
          TOKEN=$(curl -fs -X POST localhost:8000/auth/login -H 'Content-Type: application/json' -d "$BODY" | python -c "import json,sys;print(json.load(sys.stdin)['access_token'])")
          curl -fs localhost:8000/kpis -H "Authorization: Bearer $TOKEN" | head -c 300
      - name: Orkiestrator (bez LLM) przez mcp-wms po HTTP
        run: |
          set -a; . ./.env; set +a
          python -m orchestrator --mode heuristic --cycles 1 --mcp-url http://localhost:8765/mcp | tee orch.json
          grep -q '"waves_released": \["WAVE-' orch.json
      - name: Logi przy błędzie
        if: failure()
        run: docker compose logs --tail 200
      - run: docker compose down -v
        if: always()
